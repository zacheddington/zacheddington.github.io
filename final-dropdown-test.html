                border-radius: 4px;

                position: fixed;

                right: 10px;

                color: white;
                padding: 1rem;
                border-radius: 4px;
                font-size: 0.8rem;
                max-width: 300px;
                z-index: 10000;

                    <li>
                        <a href="/profile/" data-page="profile">
                            <svg
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path

            </div>

            <div class="user-profile">
                <button class="logout-btn" onclick="logout()">
                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
                        ></path>
                        <polyline points="16,17 21,12 16,7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Logout
                </button>
            </div>
        </header>

        <script>
            function updateDebugInfo() {
                document.getElementById('width').textContent =
                    window.innerWidth;
                document.getElementById('adminStatus').textContent =
                    document.body.classList.contains('is-admin') ? 'YES' : 'NO';
            }

            function toggleAdmin() {
                document.body.classList.toggle('is-admin');
                updateDebugInfo();
            }

            function testDropdowns() {
                const results = [];
                const dropdowns = document.querySelectorAll('.nav-dropdown');

                dropdowns.forEach((dropdown, i) => {
                    const trigger = dropdown.querySelector('.dropdown-trigger');
                    const content = dropdown.querySelector('.dropdown-content');
                    const isAdmin = dropdown.classList.contains('admin-only');

                    if (trigger && content) {
                        // Test visibility
                        const triggerVisible = trigger.offsetHeight > 0;
                        const contentVisible = content.offsetHeight > 0;

                        results.push(
                            `Dropdown ${i + 1} (${
                                isAdmin ? 'admin' : 'normal'
                            }): Trigger=${triggerVisible}, Content=${contentVisible}`
                        );
                    }
                });

                document.getElementById('hoverTests').innerHTML =
                    results.join('<br>');
            }

            function forceShowDropdowns() {
                const style = document.createElement('style');
                style.id = 'force-dropdown-style';
                style.textContent = `
                .nav-dropdown .dropdown-content {
                    display: block !important;
                    background: rgba(255,0,0,0.9) !important;
                    border: 2px solid yellow !important;
                }
            `;

                // Remove existing forced style
                const existing = document.getElementById(
                    'force-dropdown-style'
                );
                if (existing) {
                    existing.remove();
                } else {
                    document.head.appendChild(style);
                }
            }

            // Initialize
            updateDebugInfo();
            window.addEventListener('resize', updateDebugInfo);

            // Test after a short delay
            setTimeout(testDropdowns, 500);
        </script>
    </body>
</html>
