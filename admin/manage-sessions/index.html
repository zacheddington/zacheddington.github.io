<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Session Management - Integris Neuro Admin</title>

        <!-- CSS Files -->
        <link rel="stylesheet" href="../../css/base/reset.css" />
        <link rel="stylesheet" href="../../css/base/variables.css" />
        <link rel="stylesheet" href="../../css/base/typography.css" />
        <link rel="stylesheet" href="../../css/layout/containers.css" />
        <link rel="stylesheet" href="../../css/layout/header.css" />
        <link rel="stylesheet" href="../../css/layout/navigation.css" />
        <link rel="stylesheet" href="../../css/components/buttons.css" />
        <link rel="stylesheet" href="../../css/components/forms.css" />
        <link rel="stylesheet" href="../../css/components/tables.css" />
        <link rel="stylesheet" href="../../css/components/modals.css" />
        <link rel="stylesheet" href="../../css/pages/admin.css" />
        <link rel="stylesheet" href="../../css/utils/animations.css" />
        <link rel="stylesheet" href="../../css/utils/responsive.css" />
    </head>
    <body>
        <div class="app-container">
            <!-- Header -->
            <header class="app-header">
                <div class="header-content">
                    <div class="header-left">
                        <img
                            src="../../favicon.png"
                            alt="Integris Neuro"
                            class="app-logo"
                        />
                        <h1 class="app-title">Integris Neuro</h1>
                    </div>
                    <div id="menuContainer"></div>
                    <div class="user-profile">
                        <button class="logout-btn" id="logoutLink">
                            <span>Logout</span>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <main class="main-content">
                <div class="content-container">
                    <div class="page-header">
                        <h2>Session Management</h2>
                        <p class="page-description">
                            View and manage active user sessions
                        </p>
                    </div>

                    <!-- Session Management Debug Panel -->
                    <div
                        id="debugPanel"
                        style="
                            background: #f0f0f0;
                            border: 2px solid #333;
                            padding: 15px;
                            margin: 15px 0;
                            font-family: monospace;
                            font-size: 12px;
                        "
                    >
                        <h3>Debug Information</h3>
                        <div id="debugOutput">Loading debug info...</div>
                    </div>

                    <!-- Session Filters -->
                    <div class="sessions-filters">
                        <div class="filter-row">
                            <div class="filter-group">
                                <label for="sessionStatusFilter">Status:</label>
                                <select
                                    id="sessionStatusFilter"
                                    class="form-control"
                                >
                                    <option value="">All Statuses</option>
                                    <option value="active">Active</option>
                                    <option value="inactive">Inactive</option>
                                </select>
                            </div>

                            <div class="filter-group">
                                <label for="sessionUserFilter">User:</label>
                                <select
                                    id="sessionUserFilter"
                                    class="form-control"
                                >
                                    <option value="">All Users</option>
                                </select>
                            </div>

                            <div class="filter-group">
                                <label for="sessionDateFilter"
                                    >Date Range:</label
                                >
                                <select
                                    id="sessionDateFilter"
                                    class="form-control"
                                >
                                    <option value="">All Time</option>
                                    <option value="today">Today</option>
                                    <option value="week">This Week</option>
                                    <option value="month">This Month</option>
                                </select>
                            </div>

                            <div class="filter-actions">
                                <button
                                    type="button"
                                    class="btn btn-secondary"
                                    id="clearSessionFilters"
                                >
                                    Clear Filters
                                </button>
                                <button
                                    type="button"
                                    class="btn btn-primary"
                                    id="refreshSessionsBtn"
                                >
                                    Refresh
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Session Stats -->
                    <div class="session-stats">
                        <div class="stat-card">
                            <div class="stat-value" id="totalSessionsCount">
                                -
                            </div>
                            <div class="stat-label">Total Sessions</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="activeSessionsCount">
                                -
                            </div>
                            <div class="stat-label">Active Sessions</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="uniqueUsersCount">
                                -
                            </div>
                            <div class="stat-label">Unique Users</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="todaySessionsCount">
                                -
                            </div>
                            <div class="stat-label">Today's Sessions</div>
                        </div>
                    </div>

                    <!-- Session Actions -->
                    <div class="session-actions-bar">
                        <button
                            type="button"
                            class="btn btn-danger"
                            id="revokeAllSessionsBtn"
                        >
                            Revoke Selected User Sessions
                        </button>
                        <button
                            type="button"
                            class="btn btn-warning"
                            id="cleanupExpiredBtn"
                        >
                            Cleanup Expired Sessions
                        </button>
                    </div>

                    <!-- Sessions Table -->
                    <div class="users-table-container">
                        <div class="table-responsive">
                            <table class="users-table sessions-table">
                                <thead>
                                    <tr>
                                        <th>Username</th>
                                        <th>Status</th>
                                        <th>Login Time</th>
                                        <th>Last Activity</th>
                                        <th>Logout Time</th>
                                        <th>IP Address</th>
                                        <th>Browser Info</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td colspan="8" class="no-data">
                                            Loading sessions...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading...</div>
        </div>

        <!-- Modal Container -->
        <div id="modalContainer"></div>

        <!-- JavaScript Files -->
        <script src="../../js/shared/head-manager.js"></script>
        <script src="../../js/shared/auth-utils.js"></script>
        <script src="../../js/shared/api-client.js"></script>
        <script src="../../js/shared/modal-manager.js"></script>
        <script src="../../js/shared/navigation.js"></script>
        <script src="../../js/pages/admin.js"></script>
        <script>
            // Debugging helper function to show output on page
            function addDebugInfo(message) {
                const debugOutput = document.getElementById('debugOutput');
                if (debugOutput) {
                    debugOutput.innerHTML +=
                        '<br>' + new Date().toISOString() + ': ' + message;
                }
                console.log(message);
            }

            // Immediate DOM test
            addDebugInfo('🔧 Running immediate DOM test...');
            addDebugInfo('🔧 Document ready state: ' + document.readyState);

            function testDOMElements() {
                addDebugInfo('🔧 Testing DOM elements...');
                const table = document.querySelector('.sessions-table');
                const tbody = document.querySelector('.sessions-table tbody');
                const usersTable = document.querySelector('.users-table');
                const usersTableTbody =
                    document.querySelector('.users-table tbody');

                addDebugInfo('🔧 .sessions-table found: ' + !!table);
                addDebugInfo('🔧 .sessions-table tbody found: ' + !!tbody);
                addDebugInfo('🔧 .users-table found: ' + !!usersTable);
                addDebugInfo(
                    '🔧 .users-table tbody found: ' + !!usersTableTbody
                );

                const allTables = document.querySelectorAll('table');
                const allTbodies = document.querySelectorAll('tbody');
                addDebugInfo('🔧 Total tables: ' + allTables.length);
                addDebugInfo('🔧 Total tbodies: ' + allTbodies.length);

                // Log each table's classes
                allTables.forEach((t, i) => {
                    addDebugInfo(`🔧 Table ${i} classes: "${t.className}"`);
                });

                // If we found elements, test innerHTML manipulation
                if (tbody) {
                    addDebugInfo('🔧 Testing tbody innerHTML manipulation...');
                    const originalContent = tbody.innerHTML;
                    tbody.innerHTML =
                        '<tr><td colspan="8" style="text-align: center; color: green; font-weight: bold;">✅ TEST: DOM manipulation works! Table found and accessible.</td></tr>';
                    addDebugInfo('🔧 innerHTML set successfully');
                    setTimeout(() => {
                        tbody.innerHTML = originalContent;
                        addDebugInfo('🔧 Original content restored');
                    }, 3000);
                } else {
                    addDebugInfo(
                        '❌ No tbody found - cannot test manipulation'
                    );
                }
            }

            // Test immediately
            setTimeout(() => {
                addDebugInfo('🔧 Initial test after 50ms...');
                testDOMElements();
            }, 50);

            // Initialize the session management page
            document.addEventListener('DOMContentLoaded', function () {
                addDebugInfo('🔧 DOMContentLoaded event fired');
                testDOMElements();

                // Load shared head content
                if (window.headManager) {
                    window.headManager.loadSharedHead();
                    addDebugInfo('🔧 Head manager loaded');
                } else {
                    addDebugInfo('🔧 Head manager not available');
                }

                // Initialize auth and navigation
                if (window.authUtils) {
                    window.authUtils.init();
                    addDebugInfo('🔧 Auth utils initialized');
                } else {
                    addDebugInfo('🔧 Auth utils not available');
                }

                if (window.navigation) {
                    window.navigation.init();
                    addDebugInfo('🔧 Navigation initialized');
                } else {
                    addDebugInfo('🔧 Navigation not available');
                }

                // Initialize modal manager
                if (window.modalManager) {
                    window.modalManager.init();
                    addDebugInfo('� Modal manager initialized');
                } else {
                    addDebugInfo('🔧 Modal manager not available');
                }

                // Initialize session management specifically
                addDebugInfo('🔍 DOM loaded, checking table existence...');

                if (
                    window.adminPage &&
                    window.adminPage.initializeSessionManagement
                ) {
                    addDebugInfo(
                        '🔍 AdminPage available, initializing session management...'
                    );

                    // Add a small delay to ensure DOM is fully ready
                    setTimeout(() => {
                        addDebugInfo(
                            '🔍 After 500ms timeout - initializing session management...'
                        );
                        testDOMElements();

                        try {
                            window.adminPage.initializeSessionManagement();
                            addDebugInfo(
                                '✅ Session management initialization called successfully'
                            );
                        } catch (error) {
                            addDebugInfo(
                                '❌ Error during session management initialization: ' +
                                    error.message
                            );
                        }
                    }, 500);
                } else {
                    addDebugInfo(
                        '❌ AdminPage or initializeSessionManagement not found'
                    );
                    addDebugInfo(
                        '🔍 window.adminPage: ' +
                            (window.adminPage ? 'exists' : 'undefined')
                    );
                    if (window.adminPage) {
                        addDebugInfo(
                            '🔍 adminPage.initializeSessionManagement: ' +
                                (window.adminPage.initializeSessionManagement
                                    ? 'exists'
                                    : 'undefined')
                        );
                        addDebugInfo(
                            '🔍 Available adminPage methods: ' +
                                Object.keys(window.adminPage).join(', ')
                        );
                    }
                }
            });
        </script>
    </body>
</html>
