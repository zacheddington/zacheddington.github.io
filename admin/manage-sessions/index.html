<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Session Management - Integris Neuro Admin</title>

        <!-- Security: Prevent caching of authenticated pages -->
        <meta
            http-equiv="Cache-Control"
            content="no-cache, no-store, must-revalidate"
        />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />

        <!-- Favicon and Icons -->
        <link rel="icon" type="image/x-icon" href="../../favicon.ico" />
        <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
        <link rel="icon" type="image/png" href="../../favicon.png" />

        <!-- Fonts and CSS -->
        <link
            href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../../css/main.css" />
    </head>
    <body class="content-page">
        <!-- Header -->
        <header class="app-header">
            <!-- Navigation will be loaded here by JavaScript -->
        </header>

        <div class="admin-container">
            <!-- Session Management Section -->
            <div class="admin-section" id="sessionManagementSection">
                <div class="section-header">
                    <h2>User Session Management</h2>
                    <p>View and manage active user sessions</p>
                </div>

                <!-- Session Management Filters -->
                <div class="admin-form">
                    <div class="form-section">
                        <h3>Session Filters</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="sessionUserFilter"
                                    >Filter by User</label
                                >
                                <input
                                    type="text"
                                    id="sessionUserFilter"
                                    placeholder="Search by username..."
                                    autocomplete="off"
                                />
                                <small class="field-note"
                                    >Enter username to view specific user's
                                    sessions</small
                                >
                            </div>
                            <div class="form-group">
                                <label for="sessionMethodFilter"
                                    >Login Method</label
                                >
                                <select id="sessionMethodFilter">
                                    <option value="">All Methods</option>
                                    <option value="password">Password</option>
                                    <option value="2fa">2FA</option>
                                    <option value="backup_code">
                                        Backup Code
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button
                                type="button"
                                class="primary-btn"
                                id="loadSessionsBtn"
                            >
                                Load Sessions
                            </button>
                            <button
                                type="button"
                                class="secondary-btn"
                                id="refreshSessionsBtn"
                            >
                                Refresh
                            </button>
                            <button
                                type="button"
                                class="danger-btn"
                                id="cleanupSessionsBtn"
                            >
                                Cleanup Expired
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Sessions Table -->
                <div class="users-table-container">
                    <div class="table-responsive">
                        <table class="users-table" id="sessionsTable">
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th>Login Time</th>
                                    <th>Last Activity</th>
                                    <th>IP Address</th>
                                    <th>Browser</th>
                                    <th>Method</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="sessionsTableBody">
                                <!-- Sessions will be loaded here dynamically -->
                            </tbody>
                        </table>
                    </div>
                    <div id="sessionsLoading" class="loading-message hidden">
                        Loading sessions...
                    </div>
                    <div id="noSessionsFound" class="no-results hidden">
                        No active sessions found.
                    </div>
                </div>
            </div>
        </div>
        <!-- Load shared modules first -->
        <script src="../../js/shared/api-client.js"></script>
        <script src="../../js/shared/modal-manager.js"></script>
        <script src="../../js/shared/password-utils.js"></script>
        <script src="../../js/shared/field-validation.js"></script>
        <script src="../../js/shared/auth-utils.js"></script>
        <script src="../../js/shared/page-transitions.js"></script>
        <script src="../../js/shared/navigation.js"></script>
        <script src="../../js/shared/table-utils.js"></script>
        <script src="../../js/shared/address-validation.js"></script>

        <!-- Load page-specific module -->
        <script src="../../js/pages/admin.js"></script>

        <!-- Load main controller -->
        <script src="../../js/main.js"></script>
    </body>
</html>
