<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Main App Navigation Only Test</title>
        <style>
            /* Reset basic styles */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, sans-serif;
                background: #2c3e50;
                min-height: 100vh;
                overflow: visible !important; /* Force visible overflow */
            }

            /* Debug panel */
            .debug-panel {
                position: fixed;
                top: 10px;
                right: 10px;
                background: white;
                border: 2px solid black;
                padding: 10px;
                z-index: 100000;
                font-size: 12px;
                max-width: 250px;
            }

            /* Simple content to show page works */
            .simple-content {
                margin-top: 100px;
                padding: 20px;
                color: white;
                text-align: center;
            }

            /* Override any possible clipping */
            * {
                overflow: visible !important;
            }
        </style>

        <!-- Load only the essential CSS for navigation -->
        <link rel="stylesheet" href="css/base/variables.css" />
        <link rel="stylesheet" href="css/base/reset.css" />
        <link rel="stylesheet" href="css/layout/header.css" />
        <link rel="stylesheet" href="css/layout/navigation.css" />
    </head>
    <body>
        <div class="debug-panel">
            <h3>Navigation Only Test</h3>
            <div id="viewport-info"></div>
            <button onclick="debugDropdown()">Debug Dropdown</button>
            <div id="debug-results"></div>
        </div>

        <!-- Load only the header with navigation -->
        <div id="top-navigation-placeholder"></div>

        <div class="simple-content">
            <h1>Navigation Only Test</h1>
            <p>
                This page loads only the navigation components to isolate the
                dropdown issue.
            </p>
            <p>Resize to ≤600px and test the dropdowns.</p>
        </div>

        <!-- Load only essential JavaScript -->
        <script src="js/shared/head-manager.js"></script>
        <script src="js/shared/navigation.js"></script>

        <script>
            function updateViewport() {
                const info = document.getElementById('viewport-info');
                info.innerHTML = `
                Width: ${window.innerWidth}px<br>
                Small: ${window.innerWidth <= 600 ? 'YES' : 'NO'}
            `;
            }

            function debugDropdown() {
                const results = document.getElementById('debug-results');
                const dropdown = document.querySelector(
                    '.nav-dropdown .dropdown-content'
                );

                if (!dropdown) {
                    results.innerHTML = 'No dropdown found!';
                    return;
                }

                // Force show
                dropdown.style.display = 'block';
                dropdown.style.background = 'yellow';
                dropdown.style.border = '3px solid red';
                dropdown.style.zIndex = '999999';
                dropdown.style.position = 'absolute';

                const rect = dropdown.getBoundingClientRect();
                const computedStyle = window.getComputedStyle(dropdown);

                results.innerHTML = `
                Position: ${rect.left}, ${rect.top}<br>
                Size: ${rect.width}x${rect.height}<br>
                Z-index: ${computedStyle.zIndex}<br>
                Display: ${computedStyle.display}<br>
                Visibility: ${computedStyle.visibility}<br>
                Opacity: ${computedStyle.opacity}<br>
                Transform: ${computedStyle.transform}<br>
                Overflow: ${document.body.style.overflow || 'default'}
            `;

                // Auto-hide after 3 seconds
                setTimeout(() => {
                    dropdown.style.display = '';
                    dropdown.style.background = '';
                    dropdown.style.border = '';
                }, 3000);
            }

            // Initialize
            window.addEventListener('load', async () => {
                // Set up fake user data
                localStorage.setItem('user', JSON.stringify({ role: 'admin' }));

                // Load navigation
                if (window.navigation && window.navigation.loadTopNavigation) {
                    await window.navigation.loadTopNavigation();
                }

                updateViewport();

                // Auto-debug after load
                setTimeout(debugDropdown, 1500);
            });

            window.addEventListener('resize', updateViewport);
        </script>
    </body>
</html>
