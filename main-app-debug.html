<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Debug Main App Dropdown</title>
        <link
            href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/main.css" />
        <style>
            body {
                padding: 20px;
            }
            .debug-info {
                position: fixed;
                top: 10px;
                right: 10px;
                background: rgba(0, 0, 0, 0.8);
                color: white;
                padding: 1rem;
                border-radius: 4px;
                font-size: 0.8rem;
                max-width: 300px;
                z-index: 10000;
            }
            .test-results {
                margin: 20px 0;
                padding: 1rem;
                background: #f0f0f0;
                border-radius: 4px;
            }
        </style>
    </head>
    <body>
        <div class="debug-info">
            <div>Screen: <span id="width"></span>px</div>
            <div>Dropdowns found: <span id="dropdownCount">0</span></div>
            <div>Hover working: <span id="hoverStatus">Testing...</span></div>
            <div id="cssStatus"></div>
        </div>

        <h1>Main App Dropdown Debug</h1>

        <!-- Header Bar - Same as admin page -->
        <header class="app-header">
            <!-- Navigation will be loaded here by JavaScript -->
        </header>

        <div class="test-results">
            <h2>Test Results:</h2>
            <div id="testResults"></div>
        </div>

        <!-- Load all the main app scripts -->
        <script src="js/shared/head-manager.js"></script>
        <script src="js/shared/auth-utils.js"></script>
        <script src="js/shared/api-client.js"></script>
        <script src="js/shared/navigation.js"></script>
        <script>
            function updateDebugInfo() {
                document.getElementById('width').textContent =
                    window.innerWidth;

                // Count dropdowns
                const dropdowns = document.querySelectorAll('.nav-dropdown');
                document.getElementById('dropdownCount').textContent =
                    dropdowns.length;

                // Test CSS hover
                const testDropdown = document.querySelector('.nav-dropdown');
                if (testDropdown) {
                    const content =
                        testDropdown.querySelector('.dropdown-content');
                    if (content) {
                        const computedStyle = window.getComputedStyle(content);
                        document.getElementById('cssStatus').innerHTML = `
                        Default display: ${computedStyle.display}<br>
                        Z-index: ${computedStyle.zIndex}<br>
                        Position: ${computedStyle.position}
                    `;
                    }
                }
            }

            function testHover() {
                const dropdown = document.querySelector('.nav-dropdown');
                const content = dropdown?.querySelector('.dropdown-content');

                if (dropdown && content) {
                    // Simulate hover
                    dropdown.classList.add('hover-test');

                    // Add temporary CSS to test
                    const style = document.createElement('style');
                    style.textContent =
                        '.nav-dropdown.hover-test .dropdown-content { display: block !important; background: red !important; }';
                    document.head.appendChild(style);

                    setTimeout(() => {
                        const isVisible = content.offsetHeight > 0;
                        document.getElementById('hoverStatus').textContent =
                            isVisible ? 'YES' : 'NO';
                        dropdown.classList.remove('hover-test');
                        document.head.removeChild(style);
                    }, 100);
                } else {
                    document.getElementById('hoverStatus').textContent =
                        'No dropdown found';
                }
            }

            // Initialize
            window.addEventListener('load', async () => {
                // Set up fake user data for admin menu
                localStorage.setItem('user', JSON.stringify({ role: 'admin' }));

                // Load navigation
                if (window.navigation && window.navigation.loadTopNavigation) {
                    await window.navigation.loadTopNavigation();
                }

                updateDebugInfo();
                testHover();

                // Update debug info when resizing
                window.addEventListener('resize', () => {
                    updateDebugInfo();
                    setTimeout(testHover, 100);
                });

                // Test dropdown on click
                setTimeout(() => {
                    const dropdowns =
                        document.querySelectorAll('.nav-dropdown');
                    dropdowns.forEach((dropdown, i) => {
                        const trigger =
                            dropdown.querySelector('.dropdown-trigger');
                        const content =
                            dropdown.querySelector('.dropdown-content');

                        if (trigger && content) {
                            const results =
                                document.getElementById('testResults');
                            results.innerHTML += `<div>Dropdown ${
                                i + 1
                            }: Trigger found, Content found</div>`;

                            // Test hover event
                            trigger.addEventListener('mouseenter', () => {
                                results.innerHTML += `<div>Mouse enter on dropdown ${
                                    i + 1
                                }</div>`;
                            });
                        }
                    });
                }, 1000);
            });
        </script>
    </body>
</html>
