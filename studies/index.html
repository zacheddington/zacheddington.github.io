<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Studies - Integris Neuro</title>
        <base href="/" />
        <meta
            http-equiv="Cache-Control"
            content="no-cache, no-store, must-revalidate"
        />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <link rel="stylesheet" href="../css/main.css" />
        <link rel="icon" type="image/x-icon" href="../favicon.ico" />
        <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
        <link rel="icon" type="image/png" href="../favicon.png" />
    </head>
    <body class="content-page">
        <header class="app-header">
            <!-- Navigation will be loaded here by JavaScript -->
        </header>
        <div class="content-container">
            <div class="admin-section">
                <div class="section-header">
                    <h2>Studies Management</h2>
                    <p>Manage patient studies and research data</p>
                </div>
                <div class="choice-container">
                    <div class="choice-grid">
                        <div class="choice-card">
                            <div class="choice-icon">
                                <svg
                                    width="48"
                                    height="48"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path
                                        d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                                    />
                                    <polyline points="14,2 14,8 20,8" />
                                    <line x1="12" y1="18" x2="12" y2="12" />
                                    <line x1="9" y1="15" x2="15" y2="15" />
                                </svg>
                            </div>
                            <h3>Create New Study</h3>
                            <p>
                                Start a new patient study with physician
                                information and scheduling details
                            </p>
                            <a
                                href="/studies/create-study/"
                                class="btn btn-primary"
                                >Create Study</a
                            >
                        </div>
                        <div class="choice-card">
                            <div class="choice-icon">
                                <svg
                                    width="48"
                                    height="48"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path
                                        d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                                    />
                                    <polyline points="14,2 14,8 20,8" />
                                    <line x1="16" y1="13" x2="8" y2="13" />
                                    <line x1="16" y1="17" x2="8" y2="17" />
                                </svg>
                            </div>
                            <h3>Manage Studies</h3>
                            <p>
                                View, edit, and manage existing patient studies
                                and research data
                            </p>
                            <a
                                href="/studies/manage-studies/"
                                class="btn btn-secondary"
                                >Manage Studies</a
                            >
                        </div>
                    </div>
                </div>
                <div class="back-to-dashboard">
                    <a href="/welcome/" class="btn btn-link">
                        <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <polyline points="15,18 9,12 15,6"></polyline>
                        </svg>
                        Back to Dashboard
                    </a>
                </div>
            </div>
        </div>

        <!-- Scripts -->
        <script src="../js/shared/auth-utils.js"></script>
        <script src="../js/shared/navigation.js"></script>
        <script src="../js/main.js"></script>
        <script>
            // Initialize page
            document.addEventListener('DOMContentLoaded', function () {
                // Check authentication
                if (!window.authUtils.isAuthenticated()) {
                    window.location.href = '/';
                    return;
                }

                // Load navigation
                window.loadTopNavigation();
            });
        </script>
    </body>
</html>
