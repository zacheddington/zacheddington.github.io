<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studies - Integris Neuro</title>
    <base href="/" />

    <!-- Security: Prevent caching of authenticated pages -->
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
  </head>
  <body class="content-page">
    <!-- Header Bar with Top Navigation -->
    <header class="app-header">
      <!-- Navigation will be loaded here by JavaScript -->
    </header>
    <div class="content-container">
      <!-- Studies Management Choice Buttons -->
      <div class="admin-choice" id="studiesChoice">
        <div class="choice-buttons">
          <a href="/studies/create-study/" class="choice-btn primary fade-nav">
            <h3>Create New Study</h3>
            <p>
              Start a new patient study with physician information and
              scheduling details
            </p>
          </a>
          <a
            href="/studies/manage-studies/"
            class="choice-btn primary fade-nav"
          >
            <h3>Manage Existing Studies</h3>
            <p>
              View, edit, and manage existing patient studies and research data
            </p>
          </a>
        </div>
      </div>
    </div>

    <!-- Load shared modules first -->
    <script src="js/shared/api-client.js?v=490"></script>
    <script src="js/shared/modal-manager.js?v=490"></script>
    <script src="js/shared/password-utils.js?v=490"></script>
    <script src="js/shared/field-validation.js?v=490"></script>
    <script src="js/shared/form-utils.js?v=490"></script>
    <script src="js/shared/string-utils.js?v=490"></script>
    <script src="js/shared/date-utils.js?v=490"></script>
    <script src="js/shared/auth-utils.js?v=490"></script>
    <script src="js/shared/page-transitions.js?v=490"></script>
    <script src="js/shared/navigation.js?v=490"></script>
    <script src="js/shared/table-utils.js?v=490"></script>
    <script src="js/shared/address-validation.js?v=490"></script>
    <!-- Load page-specific modules -->
    <script src="js/pages/studies.js?v=490"></script>
    <!-- Load main controller -->
    <script src="js/main.js?v=490"></script>
  </body>
</html>
