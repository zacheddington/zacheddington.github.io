<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dropdown Debug at 600px</title>
        <style>
            /* Reset */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: linear-gradient(135deg, #2e8b57, #20b2aa);
                padding: 20px;
                font-family: Arial, sans-serif;
                color: white;
            }

            /* Container to simulate header */
            .test-container {
                background: rgba(0, 0, 0, 0.3);
                padding: 1rem;
                border-radius: 8px;
                margin-bottom: 2rem;
            }

            /* Navigation setup */
            .nav-menu {
                display: flex;
                gap: 1rem;
            }

            /* Dropdown styles - simplified and working */
            .nav-dropdown {
                position: relative;
            }

            .dropdown-trigger {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.75rem 1rem;
                background: rgba(255, 255, 255, 0.1);
                color: white;
                text-decoration: none;
                border-radius: 4px;
                cursor: pointer;
            }

            .dropdown-content {
                position: absolute;
                top: 100%;
                left: 0;
                background: rgba(0, 0, 0, 0.9);
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 4px;
                min-width: 200px;
                z-index: 1000;
                margin-top: 0.5rem;
                display: none;
            }

            .dropdown-content a {
                display: block;
                padding: 0.75rem 1rem;
                color: white;
                text-decoration: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }

            .dropdown-content a:hover {
                background: rgba(255, 255, 255, 0.2);
            }

            .dropdown-content a:last-child {
                border-bottom: none;
            }

            /* HOVER - this should work at ALL screen sizes */
            .nav-dropdown:hover .dropdown-content {
                display: block !important;
            }

            /* Test different screen sizes */
            .screen-info {
                position: fixed;
                top: 10px;
                right: 10px;
                background: rgba(0, 0, 0, 0.8);
                padding: 0.5rem;
                border-radius: 4px;
                font-size: 0.8rem;
            }

            /* At 600px and below - should still work */
            @media (max-width: 600px) {
                .dropdown-trigger {
                    font-size: 0.9rem;
                    padding: 0.5rem 0.75rem;
                }

                .dropdown-content {
                    min-width: 180px;
                }

                /* Force it to work */
                .nav-dropdown:hover .dropdown-content {
                    display: block !important;
                    opacity: 1 !important;
                    visibility: visible !important;
                }
            }

            @media (max-width: 425px) {
                .dropdown-trigger {
                    font-size: 0.8rem;
                    padding: 0.4rem 0.6rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="screen-info">Screen: <span id="width"></span>px</div>

        <h1>Dropdown Test at Different Screen Sizes</h1>
        <p>
            Resize the window to test at ≤600px. Dropdown should work at ALL
            sizes.
        </p>

        <div class="test-container">
            <div class="nav-menu">
                <div class="nav-dropdown">
                    <a href="#" class="dropdown-trigger"> Admin Menu ▼ </a>
                    <div class="dropdown-content">
                        <a href="#">Create User</a>
                        <a href="#">Manage Users</a>
                        <a href="#">Manage Sessions</a>
                    </div>
                </div>

                <div class="nav-dropdown">
                    <a href="#" class="dropdown-trigger"> Patients ▼ </a>
                    <div class="dropdown-content">
                        <a href="#">View Patients</a>
                        <a href="#">Create Patient</a>
                        <a href="#">Manage Patients</a>
                    </div>
                </div>
            </div>
        </div>

        <script>
            function updateScreenInfo() {
                document.getElementById('width').textContent =
                    window.innerWidth;
            }

            updateScreenInfo();
            window.addEventListener('resize', updateScreenInfo);
        </script>
    </body>
</html>
