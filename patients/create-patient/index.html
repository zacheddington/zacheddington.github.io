<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Patient - Integris Neuro</title>
    <base href="/" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" href="favicon.png" />
  </head>
  <body class="content-page">
    <header class="app-header">
      <!-- Navigation will be loaded here by JavaScript -->
    </header>
    <div class="content-container">
      <div class="admin-section" id="createPatientSection">
        <div class="section-header">
          <h2>Create New Patient</h2>
        </div>
        <form
          id="createPatientForm"
          class="form"
          data-form-type="patient-registration"
          data-no-transition
        >
          <div class="form-section">
            <h3>Patient Information</h3>
            <!-- Names Row -->
            <div class="form-row names-row">
              <div class="form-group equal-width">
                <label for="patientFirstName">First Name</label>
                <input
                  type="text"
                  id="patientFirstName"
                  name="firstName"
                  required
                  maxlength="50"
                  autocomplete="given-name"
                />
                <small class="field-note">Required</small>
              </div>
              <div class="form-group equal-width">
                <label for="patientMiddleName">Middle Name</label>
                <input
                  type="text"
                  id="patientMiddleName"
                  name="middleName"
                  maxlength="50"
                  autocomplete="additional-name"
                />
                <small class="field-note">Optional</small>
              </div>
              <div class="form-group equal-width">
                <label for="patientLastName">Last Name</label>
                <input
                  type="text"
                  id="patientLastName"
                  name="lastName"
                  required
                  maxlength="50"
                  autocomplete="family-name"
                />
                <small class="field-note">Required</small>
              </div>
            </div>

            <!-- Personal Details & Contact Row -->
            <div class="form-row contact-info">
              <div class="form-group medium">
                <label for="patientDateOfBirth">Date of Birth</label>
                <input
                  type="text"
                  id="patientDateOfBirth"
                  name="dateOfBirth"
                  required
                  placeholder="MM/DD/YYYY"
                  maxlength="10"
                  autocomplete="bday"
                  pattern="^(0[1-9]|1[0-2])\/(0[1-9]|[12][0-9]|3[01])\/\d{4}$"
                  title="Enter date in MM/DD/YYYY format"
                />
                <small class="field-note">MM/DD/YYYY format</small>
              </div>
              <div class="form-group medium">
                <label for="patientPhone">Phone Number</label>
                <input
                  type="tel"
                  id="patientPhone"
                  name="phone"
                  required
                  placeholder="(555) 123-4567"
                  pattern="[\(\)\d\s\-]+"
                  autocomplete="tel"
                  inputmode="numeric"
                />
                <small class="field-note">Auto-formatted</small>
              </div>
              <div class="form-group small">
                <label for="acceptsTexts">Text Messages</label>
                <select
                  id="acceptsTexts"
                  name="acceptsTexts"
                  required
                  autocomplete="off"
                >
                  <option value="">Select...</option>
                  <option value="yes">Yes</option>
                  <option value="no">No</option>
                  <option value="unknown">Unknown</option>
                </select>
                <small class="field-note">Consent required</small>
              </div>
            </div>

            <!-- Address Fields -->
            <div class="form-row">
              <div class="form-group large">
                <label for="patientAddress1">Street Address</label>
                <input
                  type="text"
                  id="patientAddress1"
                  name="address1"
                  required
                  maxlength="100"
                  autocomplete="address-line1"
                  placeholder="123 Main Street"
                />
                <small class="field-note">Street number and name</small>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group large">
                <label for="patientAddress2"
                  >Apartment, Suite, Unit (Optional)</label
                >
                <input
                  type="text"
                  id="patientAddress2"
                  name="address2"
                  maxlength="50"
                  autocomplete="address-line2"
                  placeholder="Apt 4B, Suite 200, Unit #12..."
                />
                <small class="field-note">Additional address information</small>
              </div>
            </div>
            <!-- City, State, ZIP Row -->
            <div class="form-row address-location">
              <div class="form-group medium">
                <label for="patientCity">City</label>
                <input
                  type="text"
                  id="patientCity"
                  name="city"
                  required
                  maxlength="50"
                  autocomplete="address-level2"
                  placeholder="City name"
                />
                <small class="field-note">Required</small>
              </div>
              <div class="form-group small">
                <label for="patientState">State</label>
                <select
                  id="patientState"
                  name="state"
                  required
                  autocomplete="address-level1"
                >
                  <option value="">Select</option>
                  <option value="AL">AL - Alabama</option>
                  <option value="AK">AK - Alaska</option>
                  <option value="AZ">AZ - Arizona</option>
                  <option value="AR">AR - Arkansas</option>
                  <option value="CA">CA - California</option>
                  <option value="CO">CO - Colorado</option>
                  <option value="CT">CT - Connecticut</option>
                  <option value="DE">DE - Delaware</option>
                  <option value="FL">FL - Florida</option>
                  <option value="GA">GA - Georgia</option>
                  <option value="HI">HI - Hawaii</option>
                  <option value="ID">ID - Idaho</option>
                  <option value="IL">IL - Illinois</option>
                  <option value="IN">IN - Indiana</option>
                  <option value="IA">IA - Iowa</option>
                  <option value="KS">KS - Kansas</option>
                  <option value="KY">KY - Kentucky</option>
                  <option value="LA">LA - Louisiana</option>
                  <option value="ME">ME - Maine</option>
                  <option value="MD">MD - Maryland</option>
                  <option value="MA">MA - Massachusetts</option>
                  <option value="MI">MI - Michigan</option>
                  <option value="MN">MN - Minnesota</option>
                  <option value="MS">MS - Mississippi</option>
                  <option value="MO">MO - Missouri</option>
                  <option value="MT">MT - Montana</option>
                  <option value="NE">NE - Nebraska</option>
                  <option value="NV">NV - Nevada</option>
                  <option value="NH">NH - New Hampshire</option>
                  <option value="NJ">NJ - New Jersey</option>
                  <option value="NM">NM - New Mexico</option>
                  <option value="NY">NY - New York</option>
                  <option value="NC">NC - North Carolina</option>
                  <option value="ND">ND - North Dakota</option>
                  <option value="OH">OH - Ohio</option>
                  <option value="OK">OK - Oklahoma</option>
                  <option value="OR">OR - Oregon</option>
                  <option value="PA">PA - Pennsylvania</option>
                  <option value="RI">RI - Rhode Island</option>
                  <option value="SC">SC - South Carolina</option>
                  <option value="SD">SD - South Dakota</option>
                  <option value="TN">TN - Tennessee</option>
                  <option value="TX">TX - Texas</option>
                  <option value="UT">UT - Utah</option>
                  <option value="VT">VT - Vermont</option>
                  <option value="VA">VA - Virginia</option>
                  <option value="WA">WA - Washington</option>
                  <option value="WV">WV - West Virginia</option>
                  <option value="WI">WI - Wisconsin</option>
                  <option value="WY">WY - Wyoming</option>
                  <option value="DC">DC - District of Columbia</option>
                </select>
                <small class="field-note">Required</small>
              </div>
              <div class="form-group small">
                <label for="patientZip">ZIP Code</label>
                <input
                  type="text"
                  id="patientZip"
                  name="zip"
                  required
                  pattern="[0-9]{5}(-[0-9]{4})?"
                  maxlength="10"
                  autocomplete="postal-code"
                  placeholder="12345"
                />
                <small class="field-note">Required</small>
              </div>
            </div>
          </div>
          <div class="form-actions">
            <button
              type="submit"
              class="submit-btn"
              id="createPatientSubmitBtn"
            >
              Create Patient
            </button>
            <a href="/patients/" class="secondary-btn fade-nav">Back</a>
          </div>
        </form>
      </div>
    </div>
    <!-- Load shared modules first -->
    <script src="../../js/shared/api-client.js?v=492"></script>
    <script src="../../js/shared/modal-manager.js?v=492"></script>
    <script src="../../js/shared/password-utils.js?v=492"></script>
    <script src="../../js/shared/field-validation.js?v=492"></script>
    <script src="../../js/shared/date-utils.js?v=492"></script>
    <script src="../../js/shared/form-utils.js?v=492"></script>
    <script src="../../js/shared/string-utils.js?v=492"></script>
    <script src="../../js/shared/structured-address.js?v=492"></script>
    <script src="../../js/shared/auth-utils.js?v=492"></script>
    <script src="../../js/shared/page-transitions.js?v=492"></script>
    <script src="../../js/shared/navigation.js?v=492"></script>
    <script src="../../js/shared/table-utils.js?v=492"></script>

    <!-- Load page-specific module -->
    <script src="../../js/pages/patients.js?v=492"></script>

    <!-- Load main controller -->
    <script src="../../js/main.js?v=492"></script>
  </body>
</html>
