<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Table Debug Test</title>
        <link rel="stylesheet" href="css/main.css" />
        <style>
            .debug-info {
                background: #f8f9fa;
                border: 1px solid #dee2e6;
                border-radius: 8px;
                padding: 16px;
                margin: 16px 0;
                font-family: monospace;
                font-size: 14px;
            }
            .debug-info h3 {
                margin-top: 0;
                color: #495057;
            }
            .test-section {
                margin: 20px 0;
                padding: 20px;
                border: 1px solid #ddd;
                border-radius: 8px;
            }
            .error {
                color: #dc3545;
            }
            .success {
                color: #28a745;
            }
            .warning {
                color: #ffc107;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Table Display Debug Test</h1>

            <div class="test-section">
                <h2>Simple Test Table</h2>
                <div class="table-responsive">
                    <table class="users-table" id="testTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="testTableBody">
                            <tr>
                                <td>John Doe</td>
                                <td>john@example.com</td>
                                <td>Active</td>
                                <td><button>Edit</button></td>
                            </tr>
                            <tr>
                                <td>Jane Smith</td>
                                <td>jane@example.com</td>
                                <td>Inactive</td>
                                <td><button>Edit</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="debug-info">
                <h3>Debug Information</h3>
                <div id="debugOutput">Loading...</div>
            </div>

            <div class="test-section">
                <h2>Actions</h2>
                <button onclick="initializeTable()">
                    Initialize Table Utilities
                </button>
                <button onclick="addTestData()">Add Test Data</button>
                <button onclick="clearTable()">Clear Table</button>
                <button onclick="runDebug()">Run Debug Check</button>
            </div>
        </div>

        <script src="js/shared/table-utils.js"></script>
        <script>
            function runDebug() {
                const output = document.getElementById('debugOutput');
                let debug = [];

                // Check table existence
                const table = document.querySelector('#testTable');
                debug.push(`Table found: ${table ? 'YES' : 'NO'}`);

                if (table) {
                    debug.push(`Table class: ${table.className}`);
                    debug.push(`Table style: ${table.style.cssText || 'none'}`);
                    debug.push(
                        `Table display: ${getComputedStyle(table).display}`
                    );
                    debug.push(
                        `Table visibility: ${
                            getComputedStyle(table).visibility
                        }`
                    );

                    const tbody = table.querySelector('tbody');
                    debug.push(`Tbody found: ${tbody ? 'YES' : 'NO'}`);

                    if (tbody) {
                        debug.push(`Tbody rows: ${tbody.rows.length}`);
                        debug.push(
                            `Tbody innerHTML length: ${tbody.innerHTML.length}`
                        );
                        debug.push(
                            `Tbody display: ${getComputedStyle(tbody).display}`
                        );
                        debug.push(
                            `Tbody visibility: ${
                                getComputedStyle(tbody).visibility
                            }`
                        );
                    }
                }

                // Check table utilities
                debug.push(
                    `Table utils available: ${window.tableUtils ? 'YES' : 'NO'}`
                );

                if (window.tableUtils) {
                    debug.push(`Functions available:`);
                    debug.push(
                        `- initializeTableFormatting: ${typeof window.tableUtils
                            .initializeTableFormatting}`
                    );
                    debug.push(
                        `- addTableColumnResizeHandles: ${typeof window
                            .tableUtils.addTableColumnResizeHandles}`
                    );
                }

                output.innerHTML = debug.join('<br>');
            }

            function initializeTable() {
                if (window.tableUtils) {
                    window.tableUtils.initializeTableFormatting({
                        tableSelector: '#testTable',
                        storageKey: 'testTableColumnWidths',
                        getColumnType: window.tableUtils.getDefaultColumnType,
                    });
                    runDebug();
                } else {
                    alert('Table utilities not loaded');
                }
            }

            function addTestData() {
                const tbody = document.querySelector('#testTableBody');
                if (tbody) {
                    tbody.innerHTML += `
                    <tr>
                        <td>Test User ${Date.now()}</td>
                        <td>test@example.com</td>
                        <td>Active</td>
                        <td><button>Edit</button></td>
                    </tr>
                `;
                    runDebug();
                }
            }

            function clearTable() {
                const tbody = document.querySelector('#testTableBody');
                if (tbody) {
                    tbody.innerHTML = '';
                    runDebug();
                }
            }

            // Run initial debug
            window.addEventListener('load', function () {
                setTimeout(runDebug, 500);
            });
        </script>
    </body>
</html>
