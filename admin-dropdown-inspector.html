<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin Page Dropdown Inspection</title>
        <link
            href="https://fonts.googleapis.com/css?family=Montserrat:400,600,700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/main.css" />
        <style>
            .debug-overlay {
                position: fixed;
                bottom: 0;
                right: 0;
                width: 400px;
                height: 50vh;
                background: rgba(0, 0, 0, 0.9);
                color: white;
                padding: 20px;
                font-size: 0.8rem;
                z-index: 99999999;
                overflow-y: auto;
            }
            .debug-section {
                margin: 10px 0;
                padding: 10px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 4px;
            }
            .highlight-dropdown {
                outline: 3px solid red !important;
                background: rgba(255, 0, 0, 0.3) !important;
            }
            .highlight-trigger {
                outline: 3px solid blue !important;
                background: rgba(0, 0, 255, 0.3) !important;
            }
        </style>
    </head>
    <body class="is-admin">
        <div class="debug-overlay">
            <h3>Dropdown Debug Inspector</h3>
            <div>Screen: <span id="width"></span>px</div>
            <button onclick="inspectDropdowns()">Inspect Dropdowns</button>
            <button onclick="forceShow()">Force Show All</button>
            <button onclick="testHover()">Test Hover</button>
            <button onclick="checkCovering()">Check What's Covering</button>
            <div id="results"></div>
        </div>

        <!-- Copy of admin page header structure -->
        <header class="app-header">
            <!-- Navigation will be loaded here by JavaScript -->
        </header>

        <div style="margin-top: 100px; padding: 20px">
            <h1>Admin Page Dropdown Test</h1>
            <p>
                Navigation should be loaded above. Check debug panel for
                detailed inspection.
            </p>
        </div>

        <!-- Load all necessary scripts -->
        <script src="js/shared/head-manager.js"></script>
        <script src="js/shared/auth-utils.js"></script>
        <script src="js/shared/api-client.js"></script>
        <script src="js/shared/navigation.js"></script>

        <script>
            function updateWidth() {
                document.getElementById('width').textContent =
                    window.innerWidth;
            }

            function inspectDropdowns() {
                const results = document.getElementById('results');
                let html = '<h4>Dropdown Inspection Results:</h4>';

                const dropdowns = document.querySelectorAll('.nav-dropdown');
                html += `<div class="debug-section">Found ${dropdowns.length} dropdowns</div>`;

                dropdowns.forEach((dropdown, i) => {
                    const trigger = dropdown.querySelector('.dropdown-trigger');
                    const content = dropdown.querySelector('.dropdown-content');
                    const isAdmin = dropdown.classList.contains('admin-only');

                    html += `<div class="debug-section">`;
                    html += `<strong>Dropdown ${i + 1} (${
                        isAdmin ? 'admin' : 'normal'
                    }):</strong><br>`;

                    if (trigger) {
                        const triggerStyles = window.getComputedStyle(trigger);
                        const triggerRect = trigger.getBoundingClientRect();
                        html += `Trigger: ${triggerRect.width}x${triggerRect.height} at (${triggerRect.left}, ${triggerRect.top})<br>`;
                        html += `Trigger display: ${triggerStyles.display}<br>`;
                        html += `Trigger visibility: ${triggerStyles.visibility}<br>`;
                    }

                    if (content) {
                        const contentStyles = window.getComputedStyle(content);
                        const contentRect = content.getBoundingClientRect();
                        html += `Content: ${contentRect.width}x${contentRect.height} at (${contentRect.left}, ${contentRect.top})<br>`;
                        html += `Content display: ${contentStyles.display}<br>`;
                        html += `Content position: ${contentStyles.position}<br>`;
                        html += `Content z-index: ${contentStyles.zIndex}<br>`;
                        html += `Content visibility: ${contentStyles.visibility}<br>`;
                        html += `Content opacity: ${contentStyles.opacity}<br>`;

                        // Check if content is actually visible
                        const isVisible =
                            contentRect.width > 0 &&
                            contentRect.height > 0 &&
                            contentStyles.display !== 'none' &&
                            contentStyles.visibility !== 'hidden' &&
                            parseFloat(contentStyles.opacity) > 0;
                        html += `Actually visible: ${isVisible}<br>`;
                    }

                    html += `</div>`;
                });

                results.innerHTML = html;
            }

            function forceShow() {
                // Add extreme CSS to force dropdowns visible
                const style = document.createElement('style');
                style.id = 'force-show-style';
                style.textContent = `
                .nav-dropdown .dropdown-content {
                    display: block !important;
                    position: absolute !important;
                    top: 100% !important;
                    left: 0 !important;
                    z-index: 999999999 !important;
                    background: red !important;
                    color: white !important;
                    opacity: 1 !important;
                    visibility: visible !important;
                    transform: none !important;
                    margin-top: 5px !important;
                    min-width: 200px !important;
                    min-height: 100px !important;
                    padding: 10px !important;
                    border: 3px solid yellow !important;
                    box-shadow: 0 0 20px rgba(255,255,0,0.8) !important;
                }
                
                /* Ensure admin dropdown content gets created */
                .nav-dropdown.admin-only .dropdown-content:after {
                    content: "ADMIN DROPDOWN FORCED VISIBLE" !important;
                    display: block !important;
                    padding: 20px !important;
                    background: blue !important;
                    color: white !important;
                }
                
                /* Make sure nothing covers dropdowns */
                body > *:not(.debug-overlay):not(.app-header) {
                    z-index: 1 !important;
                    position: relative !important;
                }
            `;

                // Remove existing force style if present
                const existing = document.getElementById('force-show-style');
                if (existing) {
                    existing.remove();
                } else {
                    document.head.appendChild(style);
                }

                setTimeout(inspectDropdowns, 100);
            }

            function testHover() {
                const dropdowns = document.querySelectorAll('.nav-dropdown');
                dropdowns.forEach((dropdown, i) => {
                    const trigger = dropdown.querySelector('.dropdown-trigger');
                    const content = dropdown.querySelector('.dropdown-content');

                    if (trigger && content) {
                        // Highlight elements
                        trigger.classList.add('highlight-trigger');
                        content.classList.add('highlight-dropdown');

                        // Simulate hover
                        const hoverEvent = new Event('mouseenter', {
                            bubbles: true,
                        });
                        dropdown.dispatchEvent(hoverEvent);

                        setTimeout(() => {
                            trigger.classList.remove('highlight-trigger');
                            content.classList.remove('highlight-dropdown');
                        }, 2000);
                    }
                });

                setTimeout(inspectDropdowns, 500);
            }

            function checkCovering() {
                const results = document.getElementById('results');
                let html = '<h4>Checking What Might Cover Dropdowns:</h4>';

                // Get the first dropdown content
                const dropdown = document.querySelector(
                    '.nav-dropdown .dropdown-content'
                );
                if (dropdown) {
                    const rect = dropdown.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    // Get element at dropdown center point
                    const elementAtPoint = document.elementFromPoint(
                        centerX,
                        centerY
                    );

                    html += `<div class="debug-section">`;
                    html += `Dropdown center point: (${centerX}, ${centerY})<br>`;
                    html += `Element at that point: ${
                        elementAtPoint
                            ? elementAtPoint.tagName +
                              '.' +
                              elementAtPoint.className
                            : 'none'
                    }<br>`;

                    if (elementAtPoint) {
                        const styles = window.getComputedStyle(elementAtPoint);
                        html += `Covering element z-index: ${styles.zIndex}<br>`;
                        html += `Covering element position: ${styles.position}<br>`;
                        html += `Covering element background: ${styles.backgroundColor}<br>`;
                    }
                    html += `</div>`;

                    // Check all elements with high z-index
                    const allElements = document.querySelectorAll('*');
                    const highZElements = [];
                    allElements.forEach((el) => {
                        const zIndex = window.getComputedStyle(el).zIndex;
                        if (zIndex !== 'auto' && parseInt(zIndex) > 100) {
                            const elRect = el.getBoundingClientRect();
                            highZElements.push({
                                element: el,
                                zIndex: zIndex,
                                rect: elRect,
                                tagClass: el.tagName + '.' + el.className,
                            });
                        }
                    });

                    highZElements.sort(
                        (a, b) => parseInt(b.zIndex) - parseInt(a.zIndex)
                    );

                    html += `<div class="debug-section">`;
                    html += `<strong>High Z-Index Elements:</strong><br>`;
                    highZElements.slice(0, 10).forEach((item) => {
                        html += `${item.tagClass}: z-index ${item.zIndex}<br>`;
                    });
                    html += `</div>`;
                }

                results.innerHTML = html;
            }

            // Initialize
            window.addEventListener('load', async () => {
                // Set up fake user data for admin menu
                localStorage.setItem('user', JSON.stringify({ role: 'admin' }));

                // Load navigation
                if (window.navigation && window.navigation.loadTopNavigation) {
                    await window.navigation.loadTopNavigation();
                }

                updateWidth();
                setTimeout(inspectDropdowns, 1000);
            });

            window.addEventListener('resize', updateWidth);
        </script>
    </body>
</html>
