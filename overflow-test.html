<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Overflow Test - Dropdown Debug</title>
        <style>
            /* Override body overflow just for this test */
            body {
                overflow-x: visible !important;
                overflow-y: visible !important;
                overflow: visible !important;
            }

            /* Add visual border to body to see boundaries */
            body {
                border: 3px solid red !important;
                box-sizing: border-box !important;
            }

            /* Make sure header doesn't clip */
            .header {
                overflow: visible !important;
            }

            /* Make sure navigation doesn't clip */
            .nav-dropdown,
            .dropdown-content {
                overflow: visible !important;
            }

            /* Debug info panel */
            .debug-panel {
                position: fixed;
                top: 10px;
                right: 10px;
                background: white;
                border: 2px solid black;
                padding: 10px;
                z-index: 10000;
                font-size: 12px;
                max-width: 300px;
            }

            .debug-section {
                margin: 10px 0;
                padding: 10px;
                background: #f0f0f0;
                border: 1px solid #ccc;
            }
        </style>
        <link rel="stylesheet" href="css/main.css" />
    </head>
    <body>
        <div class="debug-panel">
            <h3>Overflow Test</h3>
            <div id="viewport-info"></div>
            <button onclick="testDropdown()">Test Dropdown</button>
            <button onclick="checkOverflow()">Check Overflow</button>
            <div id="results"></div>
        </div>

        <!-- Include the navigation structure from main app -->
        <div id="top-navigation-placeholder"></div>

        <main class="content-page">
            <div class="container">
                <h1>Testing Dropdown with Overflow Fixes</h1>
                <p>
                    This test removes overflow:hidden from body to see if that's
                    what's clipping the dropdowns.
                </p>
            </div>
        </main>

        <script src="js/shared/head-manager.js"></script>
        <script src="js/shared/navigation.js"></script>

        <script>
            function updateViewport() {
                const info = document.getElementById('viewport-info');
                info.innerHTML = `
                Window: ${window.innerWidth}x${window.innerHeight}<br>
                Screen: ${screen.width}x${screen.height}<br>
                Body: ${document.body.offsetWidth}x${document.body.offsetHeight}
            `;
            }

            function testDropdown() {
                const dropdown = document.querySelector('.nav-dropdown');
                const content = document.querySelector('.dropdown-content');

                if (dropdown && content) {
                    // Highlight the dropdown
                    dropdown.style.background = 'yellow';
                    content.style.background = 'lime';
                    content.style.border = '3px solid blue';

                    // Simulate hover
                    const hoverEvent = new Event('mouseenter', {
                        bubbles: true,
                    });
                    dropdown.dispatchEvent(hoverEvent);

                    // Get position info
                    const rect = content.getBoundingClientRect();
                    const bodyRect = document.body.getBoundingClientRect();

                    const results = document.getElementById('results');
                    results.innerHTML = `
                    <div class="debug-section">
                        <strong>Dropdown Position:</strong><br>
                        Left: ${rect.left}, Top: ${rect.top}<br>
                        Width: ${rect.width}, Height: ${rect.height}<br>
                        Right: ${rect.right}, Bottom: ${rect.bottom}<br>
                        <br>
                        <strong>Body Boundaries:</strong><br>
                        Body Width: ${bodyRect.width}<br>
                        Body Right: ${bodyRect.right}<br>
                        <br>
                        <strong>Overflow Check:</strong><br>
                        Dropdown extends past body right: ${
                            rect.right > bodyRect.right ? 'YES' : 'NO'
                        }<br>
                        Distance past body: ${Math.max(
                            0,
                            rect.right - bodyRect.right
                        )}px
                    </div>
                `;

                    setTimeout(() => {
                        dropdown.style.background = '';
                        content.style.background = '';
                        content.style.border = '';
                    }, 5000);
                }
            }

            function checkOverflow() {
                const results = document.getElementById('results');
                let html =
                    '<div class="debug-section"><strong>Overflow Styles:</strong><br>';

                const body = document.body;
                const bodyStyles = window.getComputedStyle(body);
                html += `Body overflow-x: ${bodyStyles.overflowX}<br>`;
                html += `Body overflow-y: ${bodyStyles.overflowY}<br>`;
                html += `Body overflow: ${bodyStyles.overflow}<br>`;

                const header = document.querySelector('.header');
                if (header) {
                    const headerStyles = window.getComputedStyle(header);
                    html += `Header overflow: ${headerStyles.overflow}<br>`;
                }

                const dropdown = document.querySelector('.nav-dropdown');
                if (dropdown) {
                    const dropdownStyles = window.getComputedStyle(dropdown);
                    html += `Dropdown overflow: ${dropdownStyles.overflow}<br>`;
                }

                html += '</div>';
                results.innerHTML = html;
            }

            // Initialize
            window.addEventListener('load', async () => {
                // Set up fake user data for dropdowns
                localStorage.setItem('user', JSON.stringify({ role: 'admin' }));

                // Load navigation
                if (window.navigation && window.navigation.loadTopNavigation) {
                    await window.navigation.loadTopNavigation();
                }

                updateViewport();
                setTimeout(() => {
                    testDropdown();
                    checkOverflow();
                }, 1000);
            });

            window.addEventListener('resize', updateViewport);
        </script>
    </body>
</html>
