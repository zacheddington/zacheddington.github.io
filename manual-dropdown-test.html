<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Manual Dropdown Coverage Test</title>
        <link rel="stylesheet" href="css/main.css" />
        <style>
            .debug-panel {
                position: fixed;
                top: 10px;
                right: 10px;
                background: white;
                border: 2px solid black;
                padding: 10px;
                z-index: 100000;
                font-size: 12px;
                max-width: 300px;
            }

            /* Manual dropdown styles that match the main app */
            .manual-nav {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 70px;
                background: var(--color-primary);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: var(--z-header);
            }

            .manual-dropdown {
                position: relative;
                display: inline-block;
            }

            .manual-trigger {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.75rem 1.25rem;
                color: rgba(255, 255, 255, 0.8);
                text-decoration: none;
                font-weight: 500;
                border-radius: var(--border-radius);
                transition: var(--transition-all);
                white-space: nowrap;
                font-size: 0.95rem;
                background: transparent;
                border: 1px solid transparent;
                cursor: pointer;
            }

            .manual-content {
                position: absolute;
                top: 100%;
                left: 0;
                background: rgba(var(--color-primary-rgb), 0.95);
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: var(--border-radius);
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
                min-width: 220px;
                width: max-content;
                z-index: var(--z-dropdown);
                margin-top: 0.5rem;
                display: none;
            }

            .manual-dropdown:hover .manual-content {
                display: block !important;
            }

            .manual-content a {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                padding: 0.75rem 1rem;
                color: rgba(255, 255, 255, 0.9);
                text-decoration: none;
                font-weight: 500;
                font-size: 0.9rem;
                white-space: nowrap;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                min-height: 44px;
            }

            .manual-content a:hover {
                background: rgba(255, 255, 255, 0.2);
                color: white;
            }
        </style>
    </head>
    <body>
        <div class="debug-panel">
            <h3>Manual Dropdown Test</h3>
            <div id="viewport-info"></div>
            <button onclick="testCoverage()">Test Coverage</button>
            <button onclick="showDropdown()">Force Show</button>
            <div id="results"></div>
        </div>

        <!-- Manual navigation with dropdown -->
        <div class="manual-nav">
            <div class="manual-dropdown">
                <button class="manual-trigger">
                    Patients
                    <svg
                        width="12"
                        height="12"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <polyline points="6,9 12,15 18,9"></polyline>
                    </svg>
                </button>
                <div class="manual-content">
                    <a href="#">Create Patient</a>
                    <a href="#">Manage Patients</a>
                    <a href="#">Patient Reports</a>
                </div>
            </div>

            <div class="manual-dropdown" style="margin-left: 2rem">
                <button class="manual-trigger">
                    Admin
                    <svg
                        width="12"
                        height="12"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <polyline points="6,9 12,15 18,9"></polyline>
                    </svg>
                </button>
                <div class="manual-content">
                    <a href="#">Create User</a>
                    <a href="#">Manage Users</a>
                    <a href="#">Manage Sessions</a>
                </div>
            </div>
        </div>

        <main style="margin-top: 100px; padding: 20px">
            <h1>Manual Dropdown Coverage Test</h1>
            <p>
                This test creates manual dropdowns that use the same CSS as the
                main app.
            </p>
            <p>
                Resize to ≤600px and test if dropdowns are visible when
                hovering.
            </p>
        </main>

        <script>
            function updateViewport() {
                const info = document.getElementById('viewport-info');
                info.innerHTML = `Width: ${window.innerWidth}px`;
            }

            function showDropdown() {
                const dropdown = document.querySelector('.manual-content');
                dropdown.style.display = 'block';
                dropdown.style.background = 'yellow';
                dropdown.style.border = '3px solid red';
                dropdown.style.zIndex = '999999';

                setTimeout(() => {
                    dropdown.style.display = '';
                    dropdown.style.background = '';
                    dropdown.style.border = '';
                    dropdown.style.zIndex = '';
                }, 3000);
            }

            function testCoverage() {
                const results = document.getElementById('results');
                const dropdown = document.querySelector('.manual-content');

                // Force show
                dropdown.style.display = 'block';
                dropdown.style.background = 'yellow';
                dropdown.style.border = '3px solid red';
                dropdown.style.zIndex = '999999';

                const rect = dropdown.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                const elementAtPoint = document.elementFromPoint(
                    centerX,
                    centerY
                );
                const elementsAtPoint = document.elementsFromPoint(
                    centerX,
                    centerY
                );

                let html = `
                <div style="margin: 10px 0; padding: 10px; background: #f0f0f0;">
                    <strong>Coverage Test Results:</strong><br>
                    Dropdown Rect: ${rect.left.toFixed(1)}, ${rect.top.toFixed(
                    1
                )}, ${rect.width.toFixed(1)}x${rect.height.toFixed(1)}<br>
                    Center Point: (${centerX.toFixed(1)}, ${centerY.toFixed(
                    1
                )})<br>
                    <br>
                    <strong>Element at center:</strong><br>
                    ${
                        elementAtPoint
                            ? `${elementAtPoint.tagName}.${elementAtPoint.className}`
                            : 'None'
                    }<br>
                    <br>
                    <strong>All elements at point (top to bottom):</strong><br>
            `;

                elementsAtPoint.slice(0, 5).forEach((el, i) => {
                    const style = window.getComputedStyle(el);
                    html += `${i + 1}. ${el.tagName}.${el.className} (z:${
                        style.zIndex
                    })<br>`;
                });

                html += '</div>';
                results.innerHTML = html;

                setTimeout(() => {
                    dropdown.style.display = '';
                    dropdown.style.background = '';
                    dropdown.style.border = '';
                    dropdown.style.zIndex = '';
                }, 5000);
            }

            updateViewport();
            window.addEventListener('resize', updateViewport);

            // Auto-test after load
            setTimeout(testCoverage, 1000);
        </script>
    </body>
</html>
